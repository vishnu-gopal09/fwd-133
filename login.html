<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Mess Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="auth.js"></script>
</head>
<body>
  <header class="navbar">
    <nav class="container nav-inner" aria-label="Main navigation">
      <a href="index.html" class="brand"><span class="brand-mark"></span>Mess Inventory</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#features">Features</a></li>
        <li><a href="inventory.html">Inventory</a></li>
        <li><a href="suppliers.html">Suppliers</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="login.html" id="auth-link" class="login">Login</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="auth">
      <div class="container">
        <form id="login-form" class="card auth-card" novalidate>
          <h1>Staff login</h1>
          <p class="hint">Sign in to manage inventory and suppliers.</p>
          <label>Email <input type="email" id="login-email" autocomplete="username" required></label>
          <label>Password <input type="password" id="login-pass" autocomplete="current-password" required></label>
          <label class="check"><input type="checkbox" id="show-pass"> Show password</label>
          <button type="submit" class="btn btn-primary">Login</button>
          <p class="form-msg" id="login-msg" role="alert"></p>
          <p class="demo">Demo account: <code>admin@sau.ac.in</code> / <code>mess@123</code>
            <button type="button" class="btn-small" id="fill-demo">Fill for me</button></p>
        </form>
      </div>
    </section>
  </main>

  <footer id="contact">
    <div class="container footer-inner">
      <div><strong>Mess Inventory</strong><br>A project for Fundamentals of Web Development</div>
      <div><strong>South Asian University</strong><br>Gaushala Road, New Delhi</div>
    </div>
  </footer>

  <script src="login.js"></script>
</body>
</html>
